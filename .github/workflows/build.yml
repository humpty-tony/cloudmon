name: Build and check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            engine: duckdb-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            tags: ''
            engine: duckdb-windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            tags: ''
            engine: duckdb-osx-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Fetch pinned embedded engines
        run: bash scripts/fetch-duckdb.sh
      - name: Prepare native test engine
        run: |
          gzip -dc "internal/duckdbbin/bin/${{ matrix.engine }}.gz" > "$RUNNER_TEMP/${{ matrix.engine }}"
          chmod +x "$RUNNER_TEMP/${{ matrix.engine }}"
          echo "DUCKDB_BIN=$RUNNER_TEMP/${{ matrix.engine }}" >> "$GITHUB_ENV"
      - name: Backend checks with real DuckDB
        run: go test ./internal/...
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop application
        run: wails build -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"
      - name: Check macOS universal executable
        if: runner.os == 'macOS'
        run: lipo -verify_arch x86_64 arm64 build/bin/cloudmon.app/Contents/MacOS/cloudmon
      - name: Package desktop artifact
        # Preserve executable permissions and app-bundle symlinks inside the archive.
        run: tar -czf "$RUNNER_TEMP/cloudmon-${{ runner.os }}.tar.gz" -C build/bin .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudmon-${{ runner.os }}
          path: ${{ runner.temp }}/cloudmon-${{ runner.os }}.tar.gz
          if-no-files-found: error
          retention-days: 7
