name: Build and check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            tags: ''
          - os: macos-latest
            platform: darwin/universal
            tags: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Windows C compiler for embedded DuckDB
        if: runner.os == 'Windows'
        shell: pwsh
        # Use the runner's coherent MinGW-w64 toolchain, as duckdb-go's own CI does.
        # Installing only current UCRT64 packages pulled in a linker that crashed.
        run: |
          $compiler = (Get-Command gcc -ErrorAction Stop).Source
          'CGO_ENABLED=1' >> $env:GITHUB_ENV
          'CC=gcc' >> $env:GITHUB_ENV
          'CXX=g++' >> $env:GITHUB_ENV
          Write-Output $compiler
          & $compiler --version
          $linker = & $compiler '-print-prog-name=ld'
          & $linker --version
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Search behavior checks
        working-directory: frontend
        run: npm run check:search
      - name: Backend checks with real DuckDB
        # Native static links are large; serialize package builds on hosted runners.
        run: go test -p 1 -tags "${{ matrix.tags }}" ./...
      - name: Capture setup browser check
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run check:capture-ui
      - name: Upload capture UI screenshots
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capture-ui
          path: frontend/test-results/capture/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop application
        run: wails build -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"
      - name: Check Windows compiler runtimes are statically linked
        if: runner.os == 'Windows'
        run: |
          objdump -p build/bin/cloudmon.exe > "$RUNNER_TEMP/cloudmon-imports.txt"
          if rg -i 'DLL Name:.*(libstdc|libgcc|libwinpthread)' "$RUNNER_TEMP/cloudmon-imports.txt"; then
            echo "Unexpected compiler runtime DLL dependency"
            exit 1
          fi
      - name: Check macOS universal executable
        if: runner.os == 'macOS'
        run: lipo build/bin/cloudmon.app/Contents/MacOS/cloudmon -verify_arch x86_64 arm64
      - name: Package desktop artifact
        # Preserve executable permissions and app-bundle symlinks inside the archive.
        run: tar -czf "cloudmon-${{ runner.os }}.tar.gz" -C build/bin .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudmon-${{ runner.os }}
          path: cloudmon-${{ runner.os }}.tar.gz
          if-no-files-found: error
          retention-days: 7
