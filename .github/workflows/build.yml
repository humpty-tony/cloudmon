name: Build, check and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release behavior checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate build version and release ancestry
        id: version
        run: python3 scripts/release.py metadata

  desktop:
    name: ${{ matrix.platform }}
    needs: metadata
    timeout-minutes: 20
    env:
      VITE_APP_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Link against the oldest supported glibc, not the newest runner image.
          - os: ubuntu-22.04
            platform: linux/amd64
            package: linux-amd64
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            package: windows-amd64
            tags: ''
          - os: macos-latest
            platform: darwin/universal
            package: macos-universal
            tags: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Stamp native application version
        run: python scripts/release.py stamp "$VITE_APP_VERSION"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libstdc++6 pkg-config xvfb xdotool imagemagick dbus-x11
      - name: Windows C compiler for embedded DuckDB
        if: runner.os == 'Windows'
        shell: pwsh
        # Use the runner's coherent MinGW-w64 toolchain, as duckdb-go's own CI does.
        # Installing only current UCRT64 packages pulled in a linker that crashed.
        run: |
          $compiler = (Get-Command gcc -ErrorAction Stop).Source
          'CGO_ENABLED=1' >> $env:GITHUB_ENV
          'CC=gcc' >> $env:GITHUB_ENV
          'CXX=g++' >> $env:GITHUB_ENV
          Write-Output $compiler
          & $compiler --version
          $linker = & $compiler '-print-prog-name=ld'
          & $linker --version
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Search behavior checks
        working-directory: frontend
        run: npm run check:search
      - name: Inspector behavior checks
        working-directory: frontend
        run: npm run check:inspector
      - name: Local label behavior checks
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run check:labels

      - name: Saved hunt behavior checks
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run check:saved-hunts

      - name: Backend checks with real DuckDB
        # Native static links are large; serialize package builds on hosted runners.
        run: go test -p 1 -tags "${{ matrix.tags }}" ./...
      - name: Generate investigation report browser fixture
        if: runner.os == 'Linux'
        env:
          CLOUDMON_REPORT_FIXTURE: ${{ runner.temp }}/cloudmon-report/report.html
        run: go test -p 1 ./internal/store -run '^TestInvestigationReportFixture$' -count=1
      - name: Capture setup browser check
        if: runner.os == 'Linux'
        env:
          CLOUDMON_REPORT_FIXTURE: ${{ runner.temp }}/cloudmon-report/report.html
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run check:capture-ui
      - name: UI interaction performance checks
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run check:ui-performance
      - name: Upload capture UI screenshots
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capture-ui
          path: |
            frontend/test-results/capture/*.png
            frontend/test-results/performance/*
          if-no-files-found: warn
          retention-days: 7
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop application
        run: wails build -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"
      - name: Check Windows compiler runtimes are statically linked
        if: runner.os == 'Windows'
        run: |
          objdump -p build/bin/cloudmon.exe > "$RUNNER_TEMP/cloudmon-imports.txt"
          if rg -i 'DLL Name:.*(libstdc|libgcc|libwinpthread)' "$RUNNER_TEMP/cloudmon-imports.txt"; then
            echo "Unexpected compiler runtime DLL dependency"
            exit 1
          fi
      - name: Check macOS universal executable
        if: runner.os == 'macOS'
        run: lipo build/bin/cloudmon.app/Contents/MacOS/cloudmon -verify_arch x86_64 arm64
      - name: Package desktop artifact
        env:
          PACKAGE_PLATFORM: ${{ matrix.package }}
        run: python scripts/release.py package "$VITE_APP_VERSION" dist "$PACKAGE_PLATFORM"
      - name: Verify packaged Linux ABI and native startup
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/cloudmon-package"
          tar -xzf "dist/cloudmon-$VITE_APP_VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/cloudmon-package"
          python3 scripts/check_linux_abi.py "$RUNNER_TEMP/cloudmon-package/cloudmon"
          xvfb-run -a -s '-screen 0 1280x880x24' dbus-run-session -- \
            python3 scripts/check_linux_startup.py "$RUNNER_TEMP/cloudmon-package/cloudmon" "$RUNNER_TEMP/cloudmon-linux-smoke"
      - name: Upload native Linux startup evidence
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-startup
          path: ${{ runner.temp }}/cloudmon-linux-smoke/*
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudmon-${{ runner.os }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  assets:
    name: Verify release packages
    needs: [metadata, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cloudmon-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and generate SHA-256 checksums
        run: python3 scripts/release.py assemble "$RELEASE_VERSION" release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tagged release
    needs: [metadata, assets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/release.py publish "$RELEASE_VERSION" release-assets "$GITHUB_REPOSITORY" "$RELEASE_COMMIT"
