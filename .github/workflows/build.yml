name: Build and check

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            engine: duckdb-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            tags: ''
            engine: duckdb-windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            tags: ''
            engine: duckdb-osx-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Fetch pinned embedded engines
        run: bash scripts/fetch-duckdb.sh
      - name: Prepare native test engine
        run: |
          gzip -dc "internal/duckdbbin/bin/${{ matrix.engine }}.gz" > "$RUNNER_TEMP/${{ matrix.engine }}"
          chmod +x "$RUNNER_TEMP/${{ matrix.engine }}"
          echo "DUCKDB_BIN=$RUNNER_TEMP/${{ matrix.engine }}" >> "$GITHUB_ENV"
      - name: Backend checks with real DuckDB
        run: go test ./internal/...
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop application
        run: wails build -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmon-${{ runner.os }}
          path: build/bin/
          retention-days: 7
